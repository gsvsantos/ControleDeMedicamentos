<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Paciente - Controle de Medicamentos</title>
</head>
<body>
<h1>Gestão de Pacientes</h1>

<hr/>

<a href="/paciente">Voltar</a>
<a href="/paciente/visualizar">Visualizar Pacientes</a>

<hr/>

<form action="/paciente/cadastrar" method="post">
    <label for="nome">Nome do Paciente</label>
    <br/>
    <input type="text" id="nome" name="nome"/>

    <br/>

    <label for="telefone">Telefone do Paciente</label>
    <br/>
    <input type="text" id="telefone" name="telefone"/>

    <br/>

    <label for="cartaoSus">CartãoSUS do Paciente</label>
    <br/>
    <input type="text" id="cartaoSus" name="cartaoSus"/>

    <hr/>

    <button type="submit">Cadastrar</button>
</form>
</body>
</html>
